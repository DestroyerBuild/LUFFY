name: Update Complete TODO README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-todo-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Update TODO section from main-to-dev Python changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          README = Path("README.md")
          TITLE = "### 📝 Complete TODO List"
          ENTRY = re.compile(r"^- \[ \] \*\*(.*):([0-9]+)\*\* - (.*)$")
          TODO = re.compile(r"#\s*TODO\b:?[ \t]*(.*)")


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def all_python_files():
              return sorted(p for p in git("ls-files").splitlines() if p.endswith(".py"))


          def extract_todos(paths):
              extracted = {}
              for path in sorted(paths):
                  file_path = Path(path)
                  if not file_path.is_file():
                      continue
                  entries = []
                  for line_number, line in enumerate(file_path.read_text(encoding="utf-8").splitlines(), 1):
                      match = TODO.search(line)
                      if match:
                          description = match.group(1).strip()
                          entries.append((path, line_number, description))
                  if entries:
                      extracted[path] = entries
              return extracted


          original = README.read_text(encoding="utf-8")
          if original.count(TITLE) != 1:
              raise RuntimeError(f"Expected exactly one {TITLE!r}, found {original.count(TITLE)}")

          title_start = original.index(TITLE)
          body_start = original.index("\n", title_start) + 1
          section_end = original.index("\n## ", body_start)
          prefix = original[:body_start]
          suffix = original[section_end + 1:]

          existing = {}
          for line in original[body_start:section_end].splitlines():
              match = ENTRY.match(line)
              if not match:
                  if line.strip():
                      raise RuntimeError(f"Unexpected non-entry in TODO section: {line!r}")
                  continue
              path, line_number, description = match.groups()
              existing.setdefault(path, []).append((path, int(line_number), description, line))

          changed = sorted(
              p for p in git("diff", "--name-only", "origin/main...origin/dev", "--", "*.py").splitlines() if p
          )
          dev_todos = extract_todos(all_python_files())
          updated = {path: list(entries) for path, entries in existing.items()}

          for path in changed:
              old_count = len(existing.get(path, []))
              if path in dev_todos:
                  updated[path] = [
                      (todo_path, line_number, description,
                       f"- [ ] **{todo_path}:{line_number}** - {description}")
                      for todo_path, line_number, description in dev_todos[path]
                  ]
              else:
                  updated.pop(path, None)
              new_count = len(updated.get(path, []))
              print(f"{path}: {old_count} README TODO(s) -> {new_count} TODO(s)")

          ordered_paths = sorted(updated)
          output_lines = []
          for path in ordered_paths:
              entries = sorted(updated[path], key=lambda entry: entry[1])
              last_line = 0
              for entry in entries:
                  if entry[1] <= last_line:
                      raise RuntimeError(f"Non-increasing TODO line number in {path}: {entry[1]} after {last_line}")
                  last_line = entry[1]
                  output_lines.append(entry[3])

          new_section = "\n" + "\n".join(output_lines) + "\n\n"
          result = prefix + new_section + suffix
          if result.count(TITLE) != 1:
              raise RuntimeError("TODO title was not preserved exactly once")
          README.write_text(result, encoding="utf-8")

          print(f"Scanned {len(all_python_files())} Python files on dev")
          print(f"Found {sum(len(v) for v in dev_todos.values())} TODO markers in {len(dev_todos)} files")
          print(f"Changed Python files: {changed}")
          print(f"README TODO entries: {sum(len(v) for v in existing.values())} -> {len(output_lines)}")
          PY

          git diff --stat -- README.md
          git diff -- README.md

      - name: Commit and push README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update complete TODO list"
          git push origin HEAD:dev
